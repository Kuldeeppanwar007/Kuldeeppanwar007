    <circle class="dot p2" cx="56" cy="174" r="3" fill="#3FB950"/><text x="68" y="178" font-size="12" fill="#C9D1D9">JavaScript</text><rect x="180" y="172" width="100" height="5" rx="2" fill="#1B2430"/><rect x="180" y="172" width="95" height="5" rx="2" fill="#38BDAE" opacity="0.75"/>
