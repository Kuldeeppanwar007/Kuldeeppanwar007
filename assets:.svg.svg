  <!-- footer -->
  <text x="30" y="424" font-size="11" fill="#58697A">$ monitoring since 2019 &#183; incidents handled: all of them &#183; status: shipping</text>
  <rect class="cursor" x="565" y="414" width="7" height="12" fill="#38BDAE"/>
