<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <style>
    .dot { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .p1 { animation-delay: 0.2s; } .p2 { animation-delay: 0.5s; }
    .p3 { animation-delay: 0.8s; } .p4 { animation-delay: 1.1s; }
    .p5 { animation-delay: 1.4s; }
    .live { animation: pulse 1.4s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="900" height="430" fill="#0A0E14"/>
  <defs>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#111925" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="430" fill="url(#grid2)"/>

  <!-- header -->
  <circle class="live" cx="42" cy="38" r="5" fill="#3FB950"/>
  <text x="58" y="43" font-size="14" fill="#E6EDF3" letter-spacing="2">STACK.STATUS</text>
  <text x="185" y="43" font-size="12" fill="#38BDAE" letter-spacing="1">// ALL SYSTEMS OPERATIONAL</text>
  <text x="868" y="43" font-size="12" fill="#8B949E" letter-spacing="1" text-anchor="end">UPTIME: 7+ YEARS</text>
  <path d="M30 58 h840" stroke="#1E2A38"/>

