<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <style>
    .l { animation: typein 0.25s ease-out backwards; }
    @keyframes typein { from { opacity: 0; transform: translateY(4px); } }
    .d1 { animation-delay: 0.5s; }
    .d2 { animation-delay: 1.1s; }
    .d3 { animation-delay: 1.6s; }
    .d4 { animation-delay: 2.1s; }
    .d5 { animation-delay: 2.6s; }
    .d6 { animation-delay: 3.1s; }
    .name { animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; animation-delay: 3.4s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ring { transform-origin: 690px 130px; animation: spin 16s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(-10px); } to { transform: translateY(370px); } }
    .glow { animation: glow 3.5s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }
  </style>

  <!-- background -->
  <rect width="900" height="360" fill="#0A0E14"/>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#131B26" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDAE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38BDAE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#grid)"/>
  <rect width="900" height="120" fill="url(#fade)"/>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="900" height="3" fill="#38BDAE" opacity="0.08"/>

  <!-- corner brackets -->
  <path d="M18 34 V18 H34" fill="none" stroke="#38BDAE" stroke-width="2" opacity="0.5"/>
  <path d="M866 34 V18 H850" fill="none" stroke="#38BDAE" stroke-width="2" opacity="0.5"/>
  <path d="M18 326 V342 H34" fill="none" stroke="#38BDAE" stroke-width="2" opacity="0.5"/>
  <path d="M866 326 V342 H850" fill="none" stroke="#38BDAE" stroke-width="2" opacity="0.5"/>

  <!-- ===== terminal window ===== -->
  <rect x="40" y="64" width="430" height="236" rx="10" fill="#0D1420" stroke="#1E2A38"/>
  <path d="M40 96 h430" stroke="#1E2A38"/>
  <circle cx="64" cy="80" r="5" fill="#FF5F56"/>
  <circle cx="82" cy="80" r="5" fill="#FFBD2E"/>
  <circle cx="100" cy="80" r="5" fill="#27C93F"/>
  <text x="255" y="84" font-size="11" fill="#8B949E" text-anchor="middle">kuldeep@singaji: ~/init</text>

  <g font-size="14">
    <g class="l d1">
      <text x="64" y="128" fill="#27C93F">$</text>
      <text x="80" y="128" fill="#E6EDF3">./init --role=cto --mode=secure</text>
    </g>
    <g class="l d2">
      <text x="64" y="154" fill="#38BDAE">[ OK ]</text>
      <text x="126" y="154" fill="#C9D1D9">auth.service ....... hardened</text>
    </g>
    <g class="l d3">
      <text x="64" y="180" fill="#38BDAE">[ OK ]</text>
      <text x="126" y="180" fill="#C9D1D9">encryption.core .... AES-256</text>
    </g>
    <g class="l d4">
      <text x="64" y="206" fill="#38BDAE">[ OK ]</text>
      <text x="126" y="206" fill="#C9D1D9">scale.engine ....... elastic</text>
    </g>
    <g class="l d5">
      <text x="64" y="232" fill="#38BDAE">[ OK ]</text>
      <text x="126" y="232" fill="#C9D1D9">ai.advisor ......... online</text>
    </g>
    <g class="l d6">
      <text x="64" y="262" fill="#27C93F">&#62;</text>
      <text x="80" y="262" fill="#E6EDF3">all systems nominal</text>
      <rect class="cursor" x="252" y="250" width="9" height="15" fill="#38BDAE"/>
    </g>
  </g>

  <!-- ===== emblem ===== -->
  <circle class="glow" cx="690" cy="130" r="74" fill="none" stroke="#38BDAE" stroke-width="1" opacity="0.3"/>
  <g class="ring">
    <circle cx="690" cy="130" r="62" fill="none" stroke="#38BDAE" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.6"/>
  </g>
  <path d="M690 88 l40 15 v34 c0 30 -18 46 -40 56 c-22 -10 -40 -26 -40 -56 v-34 z"
        fill="#38BDAE" fill-opacity="0.07" stroke="#38BDAE" stroke-width="2"/>
  <path d="M672 136 l13 13 l25 -28" fill="none" stroke="#38BDAE" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== name ===== -->
  <g class="name" text-anchor="middle">
    <text x="690" y="248" font-size="34" font-weight="bold" fill="#E6EDF3" letter-spacing="3">KULDEEP PANWAR</text>
    <text x="690" y="274" font-size="13" fill="#38BDAE" letter-spacing="4">CHIEF TECHNOLOGY OFFICER</text>
    <text x="690" y="294" font-size="11" fill="#8B949E" letter-spacing="2">SINGAJI SOFTWARE SOLUTIONS</text>
  </g>

  <!-- footer strip -->
  <text x="450" y="338" font-size="11" fill="#58697A" letter-spacing="3" text-anchor="middle">CYBERSECURITY &#183; FINTECH &#183; AGRITECH &#183; EDUTECH &#183; REAL ESTATE</text>
</svg>
